<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Success - Supermem</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17793428044"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --peridot: #B8E986;
            --tiffany: #0ABAB5;
            --neon-pink: #FF10F0;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
        }

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 50%, rgba(184, 233, 134, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(10, 186, 181, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 16, 240, 0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(184, 233, 134, 0.1);
            padding: 1.5rem 2rem;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            text-decoration: none;
        }

        .logo img {
            height: 2.75rem;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--peridot), var(--tiffany));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            position: relative;
            z-index: 1;
        }

        .success-container {
            max-width: 768px;
            width: 100%;
            text-align: center;
        }

        /* Success Icon */
        .success-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            50% {
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Title */
        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--peridot), var(--tiffany), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Message */
        .message-container {
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .message-primary {
            font-size: clamp(1.25rem, 2.5vw, 1.5rem);
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .message-secondary {
            font-size: clamp(1rem, 2vw, 1.125rem);
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        /* Info Box */
        .info-box {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(184, 233, 134, 0.2);
            border-radius: 20px;
            padding: 2rem;
            margin: 0 auto 2.5rem;
            max-width: 500px;
            text-align: left;
            animation: fadeInUp 0.8s ease 0.6s both;
            transition: all 0.3s ease;
        }

        .info-box:hover {
            border-color: var(--tiffany);
            box-shadow: 0 10px 40px rgba(10, 186, 181, 0.15);
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .checkmark {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            background: rgba(184, 233, 134, 0.2);
            border: 1px solid var(--peridot);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 0.125rem;
        }

        .checkmark-icon {
            color: var(--peridot);
            font-size: 0.75rem;
        }

        .info-text {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        /* CTA Buttons */
        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.8s both;
        }

        .btn {
            padding: 1rem 2rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            border: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--peridot), var(--tiffany));
            color: #000;
            box-shadow: 0 0 30px rgba(184, 233, 134, 0.3);
            padding: 1rem 3rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(184, 233, 134, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            padding: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid rgba(184, 233, 134, 0.1);
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--peridot);
        }

        .copyright {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }

            .logo img {
                height: 2.25rem;
            }

            .logo-text {
                font-size: 1.5rem;
            }

            main {
                padding: 3rem 1.5rem;
            }

            .success-icon {
                font-size: 4rem;
                margin-bottom: 1.5rem;
            }

            h1 {
                font-size: 2.5rem;
                margin-bottom: 1.25rem;
            }

            .info-box {
                padding: 1.5rem;
                margin-bottom: 2rem;
            }

            .cta-buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

            footer {
                padding: 1.5rem;
            }

            .footer-links {
                flex-direction: column;
                gap: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .logo img {
                height: 2rem;
            }

            .logo-text {
                font-size: 1.3rem;
            }

            main {
                padding: 2rem 1rem;
            }

            .success-icon {
                font-size: 3.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .info-box {
                padding: 1.25rem;
            }

            .info-item {
                gap: 0.75rem;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-content">
            <a href="/" class="logo">
                <img src="Logo_centred.svg" alt="Supermem Logo">
                <span class="logo-text">Supermem</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="success-container">
            <!-- Success Icon -->
            <div class="success-icon">

            </div>

            <!-- Title -->
            <h1>Congrats!</h1>

            <!-- Message -->
            <div class="message-container">
                <p class="message-primary">
                    You are now on our waitlist.
                </p>
                <p class="message-secondary">
                    We'll inform you when the private beta is ready.
                </p>
            </div>

            <!-- Info Box -->
            <div class="info-box">
                <div class="info-item">
                    <div class="checkmark">
                        <span class="checkmark-icon">✓</span>
                    </div>
                    <p class="info-text">
                        Your submission has been received
                    </p>
                </div>
                <div class="info-item">
                    <div class="checkmark">
                        <span class="checkmark-icon">✓</span>
                    </div>
                    <p class="info-text">
                        We'll send you updates via email
                    </p>
                </div>
                <div class="info-item">
                    <div class="checkmark">
                        <span class="checkmark-icon">✓</span>
                    </div>
                    <p class="info-text">
                        Early access will be granted soon
                    </p>
                </div>
            </div>

            <!-- CTA Buttons -->
            <div class="cta-buttons">
                <a href="/" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/terms">Terms</a>
                <a href="/privacy-policy">Privacy</a>
                <a href="mailto:contact@supermem.io">Contact</a>
            </div>
            <p class="copyright">
                &copy; 2026 Supermem. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        // Scroll to top on load
        window.scrollTo(0, 0);

        // Track successful conversion (for analytics)
        console.log('User successfully joined waitlist');

        // You can add analytics tracking here if needed
        // Example: gtag('event', 'conversion', {'send_to': 'YOUR_CONVERSION_ID'});
    </script>
</body>

</html>
