services:
  traefik:
    image: traefik:v2.11
    container_name: supermem-traefik
    restart: unless-stopped
    command:
      # 日志
      - "--log.level=INFO"
      - "--accesslog=true"
      # 入口点
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP 到 HTTPS 重定向
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Docker 提供商
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=supermem-network"
      # Let's Encrypt 证书（HTTP Challenge）
      - "--certificatesresolvers.letsencrypt.acme.email=diamond.shx@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - supermem-network

  supermem-waitlist:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: supermem-waitlist
    restart: unless-stopped
    depends_on:
      - traefik
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - supermem-network
    labels:
      - "traefik.enable=true"
      # HTTPS 路由
      - "traefik.http.routers.supermem.rule=Host(`supermem.io`) || Host(`www.supermem.io`)"
      - "traefik.http.routers.supermem.entrypoints=websecure"
      - "traefik.http.routers.supermem.tls.certresolver=letsencrypt"
      - "traefik.http.routers.supermem.service=supermem"
      - "traefik.http.services.supermem.loadbalancer.server.port=8080"

volumes:
  traefik_letsencrypt:
    driver: local

networks:
  supermem-network:
    driver: bridge

